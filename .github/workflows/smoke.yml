name: smoke
on: [push, workflow_dispatch]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci   # postinstall fetches txcript for this OS into ./bin, same as for users
      - run: npm test
      - run: node smoke.js
